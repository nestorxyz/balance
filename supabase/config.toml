project_id = "balance-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "https://balance-puce-ten.vercel.app"
additional_redirect_urls = ["https://balance-puce-ten.vercel.app", "http://localhost:5173"]
enable_signup = false

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Edge functions enabled via Supabase dashboard
# Cron for daily-charges configured via Supabase dashboard (pg_cron)

# Each function performs authorization in its own handler. New publishable and
# secret keys are not compatible with the platform's legacy JWT pre-check.
[functions.api-docs]
verify_jwt = false

[functions.auth-apikey]
verify_jwt = false

[functions.daily-backup]
verify_jwt = false

[functions.daily-charges]
verify_jwt = false

[functions.gmail-sync]
verify_jwt = false
